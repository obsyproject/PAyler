      - name: Restore submodule contents
        run: |
          PROJECT_DIR=$(dirname "$(find submodule-source -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Could not locate the cloned PAyler project"
            find submodule-source -maxdepth 4 -type f -name settings.gradle.kts
            exit 1
          fi

          echo "Found project at: $PROJECT_DIR"

          git -C submodule-source submodule update --init --recursive

          for module in taglib ffMetadataEx innertubex; do
            if [ ! -d "$PROJECT_DIR/$module" ]; then
              echo "Missing submodule: $PROJECT_DIR/$module"
              find submodule-source -maxdepth 4 -type d
              exit 1
            fi

            rm -rf "extracted/PAyler/$module"
            cp -a "$PROJECT_DIR/$module" "extracted/PAyler/$module"
          done
