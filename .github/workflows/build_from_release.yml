name: Build APK from Release Zip

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download zip from release
        run: |
          ZIP_URL=$(echo '${{ toJson(github.event.release.assets) }}' | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          zips = [a['browser_download_url'] for a in assets if a['name'].endswith('.zip')]
          print(zips[0])
          ")
          echo "Downloading $ZIP_URL"
          curl -L "$ZIP_URL" -o source.zip

      - name: Extract zip
        run: |
          unzip source.zip
          if [ -d "PAyler" ]; then
            mv PAyler/* . && mv PAyler/.github . 2>/dev/null || true
            rm -rf PAyler
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAyler-debug
          path: app/build/outputs/apk/core/debug/*.apk
          retention-days: 30

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/core/debug -name "*.apk" | head -1)
          gh release upload ${{ github.event.release.tag_name }} "$APK" --repo ${{ github.repository }}
