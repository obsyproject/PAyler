
name: Build PAyler from Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to build"
        required: true
        default: "v0.1_Test"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/obsyproject/PAyler/releases/tags/$RELEASE_TAG" > release.json

          ZIP_URL=$(jq -r '[.assets[] | select(.name | endswith(".zip"))][0].browser_download_url' release.json)

          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "ERROR: No ZIP asset found in release $RELEASE_TAG"
            exit 1
          fi

          echo "Downloading $ZIP_URL"
          curl -L --fail "$ZIP_URL" -o source.zip

      - name: Extract PAyler project
        run: |
          mkdir extracted
          unzip -q source.zip -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Could not find settings.gradle.kts"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Download project submodules
        run: |
          MODULE_FILE="$PROJECT_DIR/.gitmodules"

          if [ ! -f "$MODULE_FILE" ]; then
            echo "ERROR: .gitmodules not found"
            exit 1
          fi

          while read -r KEY MODULE_PATH; do
            MODULE_NAME="${KEY#submodule.}"
            MODULE_NAME="${MODULE_NAME%.path}"

            MODULE_URL=$(git config -f "$MODULE_FILE" "submodule.$MODULE_NAME.url")

            if [ -z "$MODULE_URL" ]; then
              echo "ERROR: No URL configured for $MODULE_NAME"
              exit 1
            fi

            echo "Downloading $MODULE_NAME"
            echo "URL: $MODULE_URL"
            echo "Path: $MODULE_PATH"

            TARGET="$PROJECT_DIR/$MODULE_PATH"

            mkdir -p "$(dirname "$TARGET")"
            rm -rf "$TARGET"

            git clone --depth 1 "$MODULE_URL" "$TARGET"

          done < <(git config -f "$MODULE_FILE" --get-regexp '^submodule\..*\.path$')

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          ./gradlew assembleCoreDebug \
            --stacktrace \
            -DskipFormatKtlint

      - name: Collect APK
        run: |
          mkdir -p apk-output

          find "$PROJECT_DIR/app/build/outputs/apk/core/debug" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-output/ \;

          if ! ls apk-output/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK was generated"
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAyler-debug
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
